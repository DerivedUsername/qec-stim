[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "qec-stim"
version = "0.1.0"
description = "Surface and bivariate-bicycle codes under circuit-level noise, with Stim"
requires-python = ">=3.11"
authors = [{ name = "Qiyu Zhang" }]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
